# Buduje instalator Windows i publikuje wydanie z plikiem latest.json dla auto-aktualizacji.
# Uruchamiane tagiem, np.: git tag v1.0.1 && git push origin v1.0.1
name: Wydanie

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Ewidencja OZiPZ v__VERSION__
          releaseBody: Pobierz plik *_x64-setup.exe i uruchom go. Zainstalowana aplikacja sama powiadamia o kolejnych wersjach.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
