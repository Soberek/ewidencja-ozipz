[package]
name = "ewidencja-ozipz"
version = "1.0.0"
description = "Ewidencja OZiPZ – Oświata Zdrowotna i Promocja Zdrowia (Państwowa Inspekcja Sanitarna)"
authors = ["Sekcja OZiPZ"]
edition = "2021"

[lib]
name = "ewidencja_ozipz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
pdf-extract = "0.10"
sha2 = "0.10"
walkdir = "2"
scraper = "0.24"
chrono = "0.4"
tokio = { version = "1", features = ["sync", "time", "net"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
